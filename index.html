<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiln CRT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: a monitor bay. Big preview on the left, a scrolling control rack on the right; stacked on phones. */
:root {
  --bezel: #121314;
  --panel: #1a1b1e;
  --panel-2: #222327;
  --line: #2e3035;
  --fg: #ebe6dc;
  --muted: #8f8b84;
  --amber: #f0b54a;
  --amber-ink: #1d1406;
  --r: #ff5a4e;
  --g: #5fe08a;
  --b: #4f8dff;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bezel);
  color: var(--fg);
  font: 14px/1.4 var(--font-body);
  overflow: hidden;
}
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* top bar */
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand-mark { display: grid; grid-template-columns: repeat(3, 6px); gap: 2px; }
.brand-mark i { width: 6px; height: 16px; border-radius: 1px; }
.brand-mark i:nth-child(1) { background: var(--r); }
.brand-mark i:nth-child(2) { background: var(--g); }
.brand-mark i:nth-child(3) { background: var(--b); }
.brand h1 { margin: 0; font: 700 19px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; }
.brand h1 span { color: var(--amber); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel-2); cursor: pointer; white-space: nowrap;
  font-weight: 500; letter-spacing: 0.02em;
}
.btn:hover { border-color: #4a4c52; }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; flex: none; }
.icon-btn { width: 32px; padding: 0; justify-content: center; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; height: 32px; }
.seg button {
  border: 0; background: var(--panel-2); padding: 0 10px; cursor: pointer;
  font: 600 12px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--muted);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); }
.field-label { font: 500 11px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
select.sel {
  height: 32px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2);
  padding: 0 8px; cursor: pointer;
}

/* workspace */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 0; }
.stage { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
.viewport {
  position: relative; min-height: 0; overflow: hidden;
  display: grid; place-items: center;
  background:
    radial-gradient(ellipse at 50% 40%, #1d1e22 0%, var(--bezel) 70%);
}
.viewport.zoomed { overflow: auto; place-items: start; }
.screen-wrap { position: relative; max-width: 100%; max-height: 100%; }
#out {
  display: block; max-width: calc(100% - 32px); max-height: calc(100% - 32px);
  margin: 16px; background: #000; box-shadow: 0 18px 50px rgba(0,0,0,0.55);
  touch-action: none;
}
.viewport.zoomed #out { max-width: none; max-height: none; }
.viewport.checker #out {
  background-color: #2a2b2f;
  background-image: linear-gradient(45deg, #34353a 25%, transparent 25%, transparent 75%, #34353a 75%), linear-gradient(45deg, #34353a 25%, transparent 25%, transparent 75%, #34353a 75%);
  background-size: 20px 20px; background-position: 0 0, 10px 10px;
}
.split {
  position: absolute; top: 16px; bottom: 16px; width: 0; border-left: 1px solid rgba(255,255,255,0.85);
  pointer-events: none; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.6);
}
.split::before, .split::after {
  position: absolute; top: 10px; font: 600 10px/1 var(--font-mono); letter-spacing: 0.12em;
  padding: 4px 6px; background: rgba(0,0,0,0.7); color: var(--fg); border-radius: 2px;
}
.split::before { content: "SOURCE"; right: 8px; }
.split::after { content: "KILN"; left: 8px; color: var(--amber); }
.drop {
  position: absolute; inset: 12px; border: 2px dashed var(--amber); border-radius: 8px;
  display: grid; place-items: center; background: rgba(18,19,20,0.82);
  font: 600 18px/1.2 var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber);
}
.badge {
  position: absolute; left: 24px; top: 24px; padding: 4px 8px; border-radius: 3px;
  background: rgba(0,0,0,0.6); font: 500 11px/1.3 var(--font-mono); letter-spacing: 0.06em; color: var(--muted);
  pointer-events: none;
  max-width: calc(100% - 48px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.badge b { color: var(--fg); font-weight: 500; }

/* recording overlay */
.rec {
  position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
  width: min(440px, calc(100% - 32px)); padding: 14px; border-radius: 6px;
  background: rgba(20,21,23,0.95); border: 1px solid var(--line); display: grid; gap: 10px;
}
.rec-row { display: flex; align-items: center; gap: 10px; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--r); animation: pulse 1s infinite; flex: none; }
.rec-dot.done { background: var(--g); animation: none; }
@keyframes pulse { 50% { opacity: 0.25; } }
.rec-title { font-weight: 600; margin-right: auto; }
.rec-time { font: 500 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--amber); }
.rec-note { color: var(--muted); font-size: 12px; margin: 0; }

/* transport */
.transport {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: 16px;
  border-top: 1px solid var(--line); background: var(--panel);
}
.scrub { flex: 1 1 200px; min-width: 120px; }
.timecode { font: 500 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 92px; }
.toggle[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }

/* rack */
.rack {
  min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel);
  padding-bottom: 32px;
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.rack-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.rack-head { display: flex; align-items: center; gap: 8px; }
.rack-head h2 { margin: 0 auto 0 0; font: 600 13px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; }
.tabs { display: flex; gap: 4px; }
.tabs button {
  border: 1px solid var(--line); background: transparent; border-radius: 3px; padding: 4px 8px; cursor: pointer;
  font: 500 11px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--fg); }
.preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.preset {
  text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px;
  padding: 8px 10px; cursor: pointer; font-weight: 500; line-height: 1.2;
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.preset span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset:hover { border-color: #4a4c52; }
.preset[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.preset .x { margin-left: auto; color: var(--muted); padding: 0 2px; }
.preset .x:hover { color: var(--r); }
.empty-note { color: var(--muted); font-size: 12px; grid-column: 1 / -1; margin: 0; }

.ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; }
.ctl label { font-size: 13px; color: #cfcac1; cursor: default; user-select: none; }
.ctl output { font: 500 11px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; min-width: 56px; }
.ctl input[type=range], .ctl select { grid-column: 1 / -1; }
.ctl.changed label { color: var(--fg); }
.ctl.changed output { color: var(--amber); }
.ctl select { height: 28px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); padding: 0 6px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 20px; background: transparent; cursor: pointer; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, var(--amber) var(--pct, 0%), var(--line) var(--pct, 0%)); }
input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
input[type=range]::-moz-range-progress { height: 3px; background: var(--amber); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 18px; margin-top: -7.5px; border-radius: 2px; background: var(--fg); border: 1px solid #000; }
input[type=range]::-moz-range-thumb { width: 10px; height: 18px; border-radius: 2px; background: var(--fg); border: 1px solid #000; }

details.mod { border-bottom: 1px solid var(--line); }
details.mod > summary {
  list-style: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; user-select: none;
}
details.mod > summary::-webkit-details-marker { display: none; }
.mod-title { font: 600 12px/1 var(--font-display); letter-spacing: 0.16em; text-transform: uppercase; margin-right: auto; }
.mod-led { width: 8px; height: 8px; border-radius: 50%; background: #3a3b40; flex: none; }
.mod.on .mod-led { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.mod-chev { width: 12px; height: 12px; color: var(--muted); transition: transform 0.15s; }
details[open] .mod-chev { transform: rotate(90deg); }
.mini {
  border: 1px solid var(--line); background: transparent; border-radius: 3px; padding: 3px 7px; cursor: pointer;
  font: 500 10px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.mini:hover { color: var(--fg); }
.mini[aria-pressed="false"] { color: #5d5f65; text-decoration: line-through; }
.mod-body { padding: 0 16px 16px; display: grid; gap: 12px; }
.mod-hint { margin: 0; color: var(--muted); font-size: 12px; }
.mod.off .mod-body .ctl { opacity: 0.45; }

.save-row { display: flex; gap: 6px; }
.save-row input { flex: 1; min-width: 0; height: 30px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); padding: 0 8px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bezel); padding: 8px 14px; border-radius: 4px; font-weight: 600; z-index: 20;
  max-width: calc(100% - 32px);
}
.fatal { padding: 32px; max-width: 560px; margin: 10vh auto; }
.fatal h2 { font-family: var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .workspace { grid-template-columns: 1fr; }
  .stage { grid-template-rows: auto auto; }
  .viewport { min-height: 0; }
  .rack { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(0px, env(safe-area-inset-left, 0px)); }
  .transport { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } .mod-chev { transition: none; } }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>Kiln <span>CRT</span></h1>
    </div>
    <div class="tools">
      <button class="btn" id="openBtn" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2.5 10v3.5h11V10"/></svg>
        Open photo or video
      </button>
      <input type="file" id="file" accept="image/*,video/*" hidden>
      <span class="field-label" id="qLabel">Raster</span>
      <div class="seg" id="quality" role="group" aria-labelledby="qLabel">
        <button type="button" data-q="SD" aria-pressed="true" title="240 lines: classic chunky tube">SD</button>
        <button type="button" data-q="HI" aria-pressed="false" title="480 lines: finer signal">HI</button>
        <button type="button" data-q="FULL" aria-pressed="false" title="Process at source resolution">FULL</button>
      </div>
      <label class="field-label" for="outSize">Output</label>
      <select class="sel" id="outSize">
        <option value="720">720p</option>
        <option value="1080" selected>1080p</option>
        <option value="1440">1440p</option>
        <option value="source">Source size</option>
      </select>
      <button class="btn" id="stillBtn" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="12" height="9" rx="1"/><circle cx="8" cy="8.5" r="2.3"/><path d="M5.5 4l1-1.5h3l1 1.5"/></svg>
        Save still
      </button>
      <button class="btn primary" id="recBtn" type="button">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="5"/></svg>
        Export video
      </button>
    </div>
  </header>

  <main class="workspace">
    <section class="stage" aria-label="Preview">
      <div class="viewport" id="viewport">
        <canvas id="out" aria-label="Processed preview"></canvas>
        <div class="split" id="split" hidden></div>
        <div class="badge" id="badge"></div>
        <div class="drop" id="drop" hidden>Drop to load</div>
        <div class="rec" id="rec" hidden>
          <div class="rec-row">
            <span class="rec-dot" id="recDot"></span>
            <span class="rec-title" id="recTitle">Recording</span>
            <span class="rec-time" id="recTime">0:00 / 0:00</span>
          </div>
          <div class="bar"><i id="recBar"></i></div>
          <p class="rec-note" id="recNote">Plays the clip once in real time with your current settings. Keep this tab visible.</p>
          <div class="rec-row" id="recActions">
            <button class="btn" id="recCancel" type="button">Cancel</button>
          </div>
        </div>
      </div>
      <div class="transport">
        <button class="btn icon-btn" id="playBtn" type="button" aria-label="Pause">
          <svg viewBox="0 0 16 16" fill="currentColor" id="playIcon"><rect x="4" y="3" width="3" height="10"/><rect x="9" y="3" width="3" height="10"/></svg>
        </button>
        <input class="scrub" type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Position">
        <span class="timecode" id="time">0:00 / 0:00</span>
        <button class="btn icon-btn toggle" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 6v4h2.5l3.5 3V3L5 6z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5" id="muteWave"/></svg>
        </button>
        <button class="btn toggle" id="compareBtn" type="button" aria-pressed="false" title="Drag on the picture to move the split (key: C)">Compare</button>
        <button class="btn toggle" id="zoomBtn" type="button" aria-pressed="false" title="View output pixels at 100% (key: Z)">100%</button>
        <button class="btn icon-btn" id="fsBtn" type="button" aria-label="Fullscreen">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg>
        </button>
      </div>
    </section>

    <aside class="rack" id="rack" aria-label="Controls">
      <div class="rack-sec">
        <div class="rack-head">
          <h2>Looks</h2>
          <div class="tabs" role="tablist" id="catTabs"></div>
        </div>
        <div class="preset-grid" id="presetGrid"></div>
        <div class="save-row">
          <input id="presetName" type="text" placeholder="Name this look" maxlength="40" aria-label="Look name">
          <button class="btn" id="savePreset" type="button">Save</button>
        </div>
        <div class="save-row">
          <button class="btn" id="randomBtn" type="button" style="flex:1">Randomize</button>
          <button class="btn" id="resetBtn" type="button" style="flex:1">Reset all</button>
        </div>
      </div>
      <div class="rack-sec" id="masterSec">
        <div class="rack-head"><h2>Master</h2></div>
      </div>
      <div id="modules"></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="kiln/shaders.js"></script>
<script src="kiln/engine.js"></script>
<script src="kiln/params.js"></script>
<script src="kiln/app.js"></script>
<script src="kiln/export.js"></script>
